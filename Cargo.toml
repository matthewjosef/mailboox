[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"

[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
resolver = "2"

[workspace.dependencies]
hdi = "=0.8.0"
hdk = "=0.7.0"
holochain_serialized_bytes = "0.0.57"
serde = "1.0"
tokio = "1.49"

[workspace.dependencies.holochain]
default-features = false
version = "=0.7.0"

[workspace.dependencies.library]
path = "dnas/library/zomes/coordinator/library"

[workspace.dependencies.library_integrity]
path = "dnas/library/zomes/integrity/library"
